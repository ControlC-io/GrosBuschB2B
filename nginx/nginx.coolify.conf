# nginx reverse proxy for Coolify deployments.
# Coolify/Traefik handles SSL termination upstream. This config is HTTP only.
# MAIN_APP_DOMAIN and ADMIN_APP_DOMAIN are substituted at container start.

worker_processes 1;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    client_max_body_size 50m;

    upstream backend {
        server backend:3000;
    }

    upstream main_frontend {
        server main_frontend:80;
    }

    upstream admin_frontend {
        server admin_frontend:80;
    }

    upstream external_api {
        server ${EXTERNAL_API_UPSTREAM};
    }

    # ── Main app ─────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name ${MAIN_APP_DOMAIN};

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location /api {
            proxy_pass         http://backend;
            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
        }

        location /external-api/ {
            proxy_pass         http://external_api/;
            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 90s;
        }

        location / {
            proxy_pass         http://main_frontend;
            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # ── Admin panel ──────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name ${ADMIN_APP_DOMAIN};

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location /api {
            proxy_pass         http://backend;
            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 90s;
        }

        location / {
            proxy_pass         http://admin_frontend;
            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}
